<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — PSZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #f5f5f5;
            --muted: #777;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #181818 0%,
                    var(--bg) 55%
                );

            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .wrapper {
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 42px;

            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;

            border: 1px solid #333;
            border-radius: 8px;
            background: #151515;

            font-family: monospace;
            font-size: 13px;
        }

        .error {
            font-family: monospace;
            font-size: clamp(100px, 22vw, 170px);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -12px;

            color: #252525;
            user-select: none;
            margin-right: 12px;
        }

        h1 {
            margin: 35px 0 12px;
            font-size: 30px;
            letter-spacing: -1px;
        }

        p {
            max-width: 440px;
            margin: 0 auto;

            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .actions {
            margin-top: 30px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 11px 20px;

            border: 1px solid #333;
            border-radius: 8px;

            background: #f5f5f5;
            color: #090909;

            text-decoration: none;
            font-size: 14px;
            font-weight: 650;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .button:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 55px;
            color: #444;

            font-family: monospace;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .logo {
                margin-bottom: 30px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 15px;
            }

            .error {
                letter-spacing: -8px;
            }
        }
    </style>
</head>

<body>
    <main class="wrapper">

        <div class="logo">
            <div class="logo-mark">P</div>
            <span>PSZ</span>
        </div>

        <div class="error">404</div>

        <h1>Page not found</h1>

        <p>
            The page you're looking for doesn't exist,
            was moved, or may have been removed.
        </p>

        <div class="actions">
            <a class="button" href="./">
                ← Back to PSZ
            </a>
        </div>

        <div class="footer">
            PSZ · GitHub Pages
        </div>

    </main>
</body>
</html>
