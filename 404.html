<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page not found · PSZ</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--bg:#0f1117;--card:#111319;--muted:#9aa0b0;--accent:#6c8cff;--text:#e6e8ee}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg),#0b0c10);color:var(--text)}
    .card{max-width:860px;padding:28px;border-radius:12px;background:var(--card);border:1px solid rgba(255,255,255,0.03);box-shadow:0 6px 30px rgba(2,6,23,0.6)}
    h1{font-size:48px;margin:0 0 8px}
    p{margin:0 0 16px;color:var(--muted)}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    a.btn{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600}
    a.primary{background:var(--accent);color:white}
    a.ghost{border:1px solid rgba(255,255,255,0.06);color:var(--text)}
    .meta{margin-top:12px;font-size:13px;color:var(--muted)}
    @media (max-width:520px){h1{font-size:36px}}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>404 — Page not found</h1>
    <p>Sorry—we couldn't find the page you were looking for. It may have been moved, renamed, or removed.</p>

    <div class="actions">
      <a class="btn primary" href="/">Go to homepage</a>
      <a class="btn ghost" href="https://github.com/SlabyLol/psz">View on GitHub</a>
      <a class="btn ghost" href="/index.html">Open documentation</a>
    </div>

    <p class="meta">Tip: if you followed a link from elsewhere, try returning to the project homepage or searching the repository on GitHub.</p>
  </div>
</body>
</html>
