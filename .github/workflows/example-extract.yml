name: Extract PSZ archive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PSZ
        run: |
          pip install git+https://github.com/SlabyLol/psz.git
          psz --version

      - name: Create encrypted PSZ archive
        run: |
          psz open sample/release.psz sample/release.psz-data.lor -o extracted/
          echo "Extracted files:"
          ls extracted

      - name: Upload PSZ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psz-demo-archive
          path: |
            extracted
          retention-days: 30
